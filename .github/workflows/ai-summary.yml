name: Résumé quotidien (Qwen)

on:
  schedule:
    # Tous les jours à 05:47 UTC (≈ 07:47 en été, 06:47 en hiver, heure suisse).
    # Minute décalée volontairement : GitHub retarde les crons pile à l'heure.
    - cron: "47 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-summary
  cancel-in-progress: false

jobs:
  summary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Générer le résumé avec Qwen
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          # Optionnel : définir ces variables dans Settings > Variables pour changer de modèle/région
          QWEN_MODEL: ${{ vars.QWEN_MODEL }}
          QWEN_BASE_URL: ${{ vars.QWEN_BASE_URL }}
        run: |
          # Une variable vide ne doit pas écraser les valeurs par défaut du script
          [ -z "$QWEN_MODEL" ] && unset QWEN_MODEL
          [ -z "$QWEN_BASE_URL" ] && unset QWEN_BASE_URL
          python3 scripts/daily_summary.py

      - name: Publier le résumé
        run: |
          git config user.name "watchtower-bot"
          git config user.email "watchtower-bot@users.noreply.github.com"
          git add data/ai-summary.json
          if git diff --cached --quiet; then
            echo "Aucun changement."
          else
            git commit -m "Résumé quotidien Watchtower"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
