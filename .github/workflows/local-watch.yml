name: Agent veille locale (Qwen)

on:
  schedule:
    - cron: "41 5 * * 3"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: local-watch
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Lancer l'agent
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          QWEN_MODEL: ${{ vars.QWEN_MODEL }}
          QWEN_BASE_URL: ${{ vars.QWEN_BASE_URL }}
        run: |
          [ -z "$QWEN_MODEL" ] && unset QWEN_MODEL
          [ -z "$QWEN_BASE_URL" ] && unset QWEN_BASE_URL
          python3 scripts/local_watch.py

      - name: Publier le résultat
        run: |
          git config user.name "watchtower-bot"
          git config user.email "watchtower-bot@users.noreply.github.com"
          git add data/local-watch.json
          if git diff --cached --quiet; then
            echo "Aucun changement."
          else
            git commit -m "Veille locale de la semaine"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
