<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Watchtower — Aventicum Quest</title>
<meta name="description" content="Poste de contrôle Aventicum Quest.">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#141110">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Watchtower">

<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>

<style>
  :root{
    --bg:#141110;
    --surface:#1c1815;
    --hairline: rgba(201,162,75,0.22);
    --hairline-strong: rgba(201,162,75,0.45);
    --gold:#c9a24b;
    --gold-dim:#8a744a;
    --text:#f5f0e6;
    --text-muted:#948c7d;
    --ok:#8ba07c;
    --err:#b3543a;
    --warn:#c98a3a;
    --serif: Georgia, "Iowan Old Style", "Times New Roman", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    box-sizing:border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box;}
  html{scroll-padding-top: env(safe-area-inset-top, 0px);}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    background-image: radial-gradient(1100px 420px at 50% -140px, rgba(201,162,75,0.12), transparent 70%);
    background-repeat:no-repeat;
    background-attachment: fixed;
    color:var(--text);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important;}
  }

  .wrap{
    max-width: 720px;
    margin: 0 auto;
    padding: 28px 20px 64px;
  }

  header.masthead{
    text-align:center;
    padding: 12px 0 28px;
  }
  .wordmark{
    font-family:var(--serif);
    font-size: 26px;
    letter-spacing: 0.5px;
    color: var(--gold);
    margin: 0;
  }
  .eyebrow{
    font-family:var(--sans);
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--text-muted);
    margin: 6px 0 0;
  }
  .masthead-rule{
    width: 56px; height:1px; margin: 16px auto 0;
    background: var(--hairline-strong);
  }

  .hero{
    text-align:center;
    padding: 20px 0 8px;
  }
  .hero-status{
    font-family:var(--serif);
    font-size: 34px;
    margin: 0;
    letter-spacing: 0.5px;
  }
  .hero-status.ok{ color: var(--gold); }
  .hero-status.err{ color: var(--err); }
  .hero-status.warn{ color: var(--warn); }
  .hero-sub{
    color: var(--text-muted);
    font-size: 13px;
    margin: 8px 0 0;
  }
  .dot{
    display:inline-block;
    width:8px; height:8px;
    border-radius:50%;
    margin-right:8px;
    position:relative; top:-2px;
  }
  .dot.ok{ background: var(--ok); }
  .dot.err{ background: var(--err); animation: pulse 1.6s ease-in-out infinite; }
  .dot.warn{ background: var(--warn); animation: pulse-warn 1.8s ease-in-out infinite; }
  @keyframes pulse{
    0%,100%{ box-shadow: 0 0 0 0 rgba(179,84,58,0.5); }
    50%{ box-shadow: 0 0 0 6px rgba(179,84,58,0); }
  }
  @keyframes pulse-warn{
    0%,100%{ box-shadow: 0 0 0 0 rgba(201,138,58,0.5); }
    50%{ box-shadow: 0 0 0 6px rgba(201,138,58,0); }
  }
  .row.warn .row-title{ color: var(--warn); }
  .row.warn .tag{ color: var(--warn); border-color: rgba(201,138,58,0.5); }

  .subscribe-row{
    display:flex; justify-content:center; margin: 22px 0 4px;
  }
  button.subscribe{
    font-family:var(--sans);
    font-size: 13px;
    color: var(--bg);
    background: var(--gold);
    border: none;
    padding: 10px 20px;
    cursor: pointer;
    letter-spacing: 0.3px;
  }
  button.subscribe:active{ opacity: 0.85; }
  button.subscribe[disabled]{
    background: transparent;
    color: var(--text-muted);
    border: 1px solid var(--hairline-strong);
  }

  section.band{
    margin-top: 16px;
    background: linear-gradient(180deg, rgba(201,162,75,0.04), transparent 60%), var(--surface);
    border: 1px solid var(--hairline);
    border-radius: 14px;
    padding: 2px 18px 12px;
    box-shadow: 0 1px 0 rgba(0,0,0,0.25);
  }
  .band-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    padding: 16px 0 8px;
  }
  .band-title{
    font-family:var(--serif);
    font-size: 15px;
    letter-spacing: 0.3px;
    color: var(--text);
  }
  .band-count{
    font-family:var(--mono);
    font-size: 11px;
    color: var(--text-muted);
  }

  .row{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap: 14px;
    padding: 12px 0;
    border-top: 1px solid var(--hairline);
  }
  .row:first-of-type{ border-top:none; }
  .row-main{ min-width:0; }
  .row-title{
    font-size: 14px;
    color: var(--text);
  }
  .row-detail{
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 2px;
  }
  .row-time{
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-muted);
    white-space: nowrap;
    padding-top: 2px;
  }
  .row-title .tag{
    display:inline-block;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.5px;
    padding: 1px 6px;
    margin-right: 8px;
    border: 1px solid var(--hairline-strong);
    border-radius: 4px;
    background: rgba(201,162,75,0.07);
    color: var(--gold-dim);
  }
  .row.err .row-title{ color: var(--err); }
  .row.err .tag{ color: var(--err); border-color: rgba(179,84,58,0.5); }

  .empty{
    padding: 16px 0 24px;
    color: var(--text-muted);
    font-size: 13px;
    font-style: italic;
  }

  /* Frise d'historique récent par système */
  .history{ display:flex; gap:3px; margin-top:7px; align-items:center; flex-wrap:wrap; }
  .hdot{ width:6px; height:6px; border-radius:50%; background: var(--hairline); flex:none; }
  .hdot.ok{ background: var(--ok); }
  .hdot.err{ background: var(--err); }
  .history-lbl{ font-family: var(--mono); font-size: 10px; color: var(--text-muted); margin-left: 4px; }

  /* Lignes cliquables (copier) */
  .row.copyable{ cursor: pointer; }
  .row.copyable:active{ opacity: 0.7; }

  /* Toast */
  .toast{
    position: fixed;
    left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%) translateY(8px);
    background: var(--surface);
    border: 1px solid var(--hairline-strong);
    color: var(--text);
    font-size: 12px;
    padding: 8px 14px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
    z-index: 60;
    max-width: 80%;
    text-align: center;
  }
  .toast.show{ opacity: 1; transform: translateX(-50%) translateY(0); }

  /* Fiche détail par système (bottom-sheet) */
  .modal-backdrop{
    position: fixed; inset: 0;
    background: rgba(8,6,5,0.62);
    opacity: 0; pointer-events: none;
    transition: opacity 0.2s ease;
    z-index: 100;
  }
  .modal-backdrop.show{ opacity: 1; pointer-events: auto; }
  .sheet{
    position: absolute;
    left: 0; right: 0; bottom: 0;
    margin: 0 auto;
    max-width: 720px;
    background: linear-gradient(180deg, rgba(201,162,75,0.05), transparent 40%), var(--surface);
    border: 1px solid var(--hairline-strong);
    border-bottom: none;
    border-radius: 16px 16px 0 0;
    padding: 20px 20px calc(26px + env(safe-area-inset-bottom, 0px));
    transform: translateY(101%);
    transition: transform 0.28s cubic-bezier(0.22,0.61,0.36,1);
    max-height: 86vh; overflow-y: auto;
  }
  .modal-backdrop.show .sheet{ transform: translateY(0); }
  .sheet-grip{ width: 36px; height: 4px; border-radius: 2px; background: var(--hairline-strong); margin: -6px auto 14px; }
  .sheet-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
  .sheet-title{ font-family: var(--serif); font-size: 20px; color: var(--text); }
  .sheet-sub{ color: var(--text-muted); font-size: 13px; margin-top: 5px; }
  .sheet-close{ background:none; border:none; color:var(--text-muted); font-size:22px; line-height:1; cursor:pointer; padding:2px 6px; flex:none; }
  .pill{ display:inline-block; font-family:var(--mono); font-size:10px; letter-spacing:0.5px; padding:2px 8px; border-radius:4px; border:1px solid var(--hairline-strong); margin-bottom:6px; }
  .pill.ok{ color:var(--ok); border-color: rgba(139,160,124,0.5); background: rgba(139,160,124,0.08); }
  .pill.err{ color:var(--err); border-color: rgba(179,84,58,0.5); background: rgba(179,84,58,0.08); }
  .stat-row{ display:flex; gap:10px; margin:18px 0 4px; }
  .stat{ flex:1; background: rgba(201,162,75,0.05); border:1px solid var(--hairline); border-radius:10px; padding:11px 12px; }
  .stat-val{ font-family:var(--serif); font-size:20px; color:var(--gold); }
  .stat-lbl{ font-size:11px; color:var(--text-muted); margin-top:3px; }
  .sheet-section-title{ font-family:var(--serif); font-size:14px; color:var(--text); margin:20px 0 10px; }
  .timeline{ display:flex; gap:3px; flex-wrap:wrap; align-items:flex-end; }
  .tl{ width:9px; height:22px; border-radius:2px; background:var(--hairline); flex:none; }
  .tl.ok{ background:var(--ok); } .tl.err{ background:var(--err); }
  .change{ display:flex; justify-content:space-between; gap:12px; padding:9px 0; border-top:1px solid var(--hairline); font-size:13px; }
  .change:first-child{ border-top:none; }
  .change-to.ok{ color:var(--ok); } .change-to.err{ color:var(--err); }
  .change-time{ font-family:var(--mono); font-size:11px; color:var(--text-muted); white-space:nowrap; }
  .sheet-muted{ color:var(--text-muted); font-size:13px; font-style:italic; }
  .row.tappable{ cursor:pointer; }
  .row.tappable:active{ opacity:0.7; }

  /* Graphe de disponibilité */
  .chart-metric{ font-family: var(--serif); font-size: 20px; color: var(--gold); }
  .chart-metric small{ font-family: var(--sans); font-size: 11px; color: var(--text-muted); margin-left: 4px; letter-spacing: 0.3px; }
  svg.spark{ width: 100%; height: 84px; display: block; margin-top: 2px; }
  .chart-axis{ display:flex; justify-content:space-between; font-family: var(--mono); font-size: 10px; color: var(--text-muted); margin-top: 6px; }
  .chart-empty{ color: var(--text-muted); font-size: 13px; font-style: italic; padding: 6px 0 12px; }

  /* Barre de progression fine pendant l'actualisation */
  .progress{
    position: fixed;
    top: env(safe-area-inset-top, 0px); left: 0; right: 0;
    height: 2px;
    background: var(--gold);
    transform: scaleX(0);
    transform-origin: left;
    opacity: 0;
    transition: transform 0.4s ease, opacity 0.3s ease;
    z-index: 50;
  }
  .progress.active{ opacity: 1; transform: scaleX(0.85); transition: transform 8s ease-out, opacity 0.3s ease; }
  .progress.done{ opacity: 0; transform: scaleX(1); transition: transform 0.2s ease, opacity 0.4s ease; }

  /* Bandeau hors-ligne / données en cache */
  .banner{
    display:none;
    text-align:center;
    font-size: 12px;
    color: var(--warn);
    border: 1px solid rgba(201,138,58,0.4);
    background: rgba(201,138,58,0.07);
    padding: 8px 12px;
    margin: 0 0 4px;
  }
  .banner.show{ display:block; }

  /* Sections repliables */
  .band-head{
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
  }
  .band-head:focus-visible{ outline: 1px solid var(--hairline-strong); outline-offset: 2px; }
  .band-title-wrap{ display:flex; align-items:center; gap:8px; min-width:0; }
  .chev{
    width: 7px; height: 7px;
    border-right: 1.5px solid var(--gold-dim);
    border-bottom: 1.5px solid var(--gold-dim);
    transform: rotate(45deg);
    transition: transform 0.2s ease;
    flex: none;
  }
  .band.collapsed .chev{ transform: rotate(-45deg); }
  .band.collapsed .band-body{ display:none; }

  .row-detail{
    overflow-wrap: anywhere;
  }

  footer{
    text-align:center;
    margin-top: 48px;
    color: var(--text-muted);
    font-size: 11px;
  }
  button.refresh{
    font-family: var(--sans);
    font-size: 11px;
    color: var(--text-muted);
    background: none;
    border: none;
    padding: 6px 8px;
    cursor: pointer;
    letter-spacing: 0.2px;
  }
  button.refresh:active{ opacity: 0.6; }
  button.refresh:disabled{ cursor: default; opacity: 0.5; }
  .refresh-spin{
    display:inline-block;
    width:9px; height:9px;
    margin-right:6px;
    border:1.5px solid var(--hairline-strong);
    border-top-color: var(--gold);
    border-radius:50%;
    position:relative; top:1px;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="progress" id="progress" aria-hidden="true"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<div class="wrap">

  <header class="masthead">
    <p class="wordmark">AVENTICUM QUEST</p>
    <p class="eyebrow">OPERATIO AQUILA — WATCHTOWER</p>
    <div class="masthead-rule"></div>
  </header>

  <div class="hero" role="status" aria-live="polite">
    <p class="hero-status ok" id="heroStatus"><span class="dot ok" id="heroDot"></span>Vérification…</p>
    <p class="hero-sub" id="heroSub">Connexion au poste de contrôle</p>
  </div>

  <div class="subscribe-row">
    <button class="subscribe" id="subscribeBtn">Activer les notifications</button>
  </div>

  <div class="banner" id="banner" role="alert"></div>

  <section class="band" data-key="chart">
    <div class="band-head" role="button" tabindex="0" aria-expanded="true">
      <span class="band-title-wrap"><span class="chev" aria-hidden="true"></span><span class="band-title">Disponibilité</span></span>
      <span class="band-count chart-metric" id="chartMetric">—</span>
    </div>
    <div class="band-body" id="chartBody"><div class="chart-empty">Historique en cours de constitution…</div></div>
  </section>

  <section class="band" data-key="checks">
    <div class="band-head" role="button" tabindex="0" aria-expanded="true">
      <span class="band-title-wrap"><span class="chev" aria-hidden="true"></span><span class="band-title">Statut des systèmes</span></span>
      <span class="band-count" id="checksCount">—</span>
    </div>
    <div class="band-body" id="checksList"><div class="empty">Chargement…</div></div>
  </section>

  <section class="band" data-key="plays">
    <div class="band-head" role="button" tabindex="0" aria-expanded="true">
      <span class="band-title-wrap"><span class="chev" aria-hidden="true"></span><span class="band-title">Parties &amp; achats récents</span></span>
      <span class="band-count" id="playsCount">—</span>
    </div>
    <div class="band-body" id="playsList"><div class="empty">Chargement…</div></div>
  </section>

  <section class="band" data-key="errors">
    <div class="band-head" role="button" tabindex="0" aria-expanded="true">
      <span class="band-title-wrap"><span class="chev" aria-hidden="true"></span><span class="band-title">Incidents</span></span>
      <span class="band-count" id="errorsCount">—</span>
    </div>
    <div class="band-body" id="errorsList"><div class="empty">Chargement…</div></div>
  </section>

  <footer>
    <button class="refresh" id="refreshBtn" type="button" aria-label="Actualiser maintenant">
      <span id="refreshLabel">Actualisé <span id="lastRefresh">—</span> · appuyer pour rafraîchir</span>
    </button>
  </footer>

</div>

<div class="modal-backdrop" id="detailModal" aria-hidden="true">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-grip" aria-hidden="true"></div>
    <div class="sheet-head">
      <div style="min-width:0">
        <span class="pill" id="sheetPill"></span>
        <div class="sheet-title" id="sheetTitle"></div>
        <div class="sheet-sub" id="sheetSub"></div>
      </div>
      <button class="sheet-close" id="sheetClose" type="button" aria-label="Fermer">&times;</button>
    </div>
    <div id="sheetContent"></div>
  </div>
</div>

<script>
(function(){
  "use strict";

  var STATUS_URL = "https://n8n-production-9874d.up.railway.app/webhook/aventicum-watchtower-status";
  var REFRESH_MS = 60000;
  var TICK_MS = 30000;               // rafraîchit les heures relatives sans refetch
  var STALE_MS = 90 * 60 * 1000;     // relevé plus vieux que 90 min = surveillance en retard

  var pollTimer = null;
  var isRefreshing = false;
  var lastChecks = [];
  var CACHE_KEY = "aq-watchtower-cache";
  var COLLAPSE_KEY = "aq-watchtower-collapsed";
  var HIST_KEY = "aq-watchtower-history";
  var MAX_HIST = 24;                  // ~24 derniers relevés horaires par système

  function lsGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
  function lsSet(k,v){ try { localStorage.setItem(k,v); } catch(e){} }

  var history = loadHistory();
  function loadHistory(){
    try { return JSON.parse(lsGet(HIST_KEY) || "{}") || {}; } catch(e){ return {}; }
  }
  // Accumule un point par système à chaque nouvel horodatage (dédupliqué)
  function recordHistory(checks){
    (checks || []).forEach(function(c){
      if(!c.checkName || !c.checkedAt) return;
      var arr = history[c.checkName] || [];
      var last = arr[arr.length - 1];
      if(!last || last.t !== c.checkedAt){
        arr.push({ t: c.checkedAt, s: c.status === "ok" ? 1 : 0 });
        while(arr.length > MAX_HIST) arr.shift();
        history[c.checkName] = arr;
      }
    });
    var tot = (checks || []).length;
    if(tot){
      var okc = (checks || []).filter(function(c){ return c.status === "ok"; }).length;
      var newest = newestCheckedAt(checks);
      var tkey = newest ? new Date(newest).toISOString() : new Date().toISOString();
      var g = history.__uptime || [];
      var lg = g[g.length - 1];
      if(!lg || lg.t !== tkey){
        g.push({ t: tkey, ok: okc, total: tot });
        while(g.length > MAX_HIST) g.shift();
        history.__uptime = g;
      }
    }
    lsSet(HIST_KEY, JSON.stringify(history));
  }

  function renderChart(){
    var body = document.getElementById("chartBody");
    var metric = document.getElementById("chartMetric");
    var series = history.__uptime || [];
    if(series.length < 2){
      body.innerHTML = '<div class="chart-empty">Historique en cours de constitution… un point par relevé horaire.</div>';
      metric.innerHTML = series.length
        ? (Math.round(series[0].ok / series[0].total * 100) + '% <small>maintenant</small>')
        : "—";
      return;
    }
    var n = series.length, W = 100, H = 40, gap = 1.4;
    var bw = (W - gap * (n - 1)) / n;
    var fullH = H - 3;
    var rects = "";
    for(var i = 0; i < n; i++){
      var p = series[i];
      var ratio = p.total ? p.ok / p.total : 0;
      var okH = fullH * ratio;
      var downH = fullH - okH;
      var xx = (i * (bw + gap)).toFixed(2);
      var w = bw.toFixed(2);
      var tip = fullTime(p.t) + ' · ' + p.ok + '/' + p.total + ' systèmes';
      // rail (total)
      rects += '<rect x="' + xx + '" y="' + (H - fullH).toFixed(2) + '" width="' + w + '" height="' + fullH.toFixed(2)
        + '" rx="0.5" fill="rgba(201,162,75,0.09)"><title>' + tip + '</title></rect>';
      // portion OK (or) en bas
      if(okH > 0.4) rects += '<rect x="' + xx + '" y="' + (H - okH).toFixed(2) + '" width="' + w + '" height="' + okH.toFixed(2)
        + '" rx="0.5" fill="var(--gold)"/>';
      // portion tombée (rouge) en haut
      if(downH > 0.4) rects += '<rect x="' + xx + '" y="' + (H - fullH).toFixed(2) + '" width="' + w + '" height="' + downH.toFixed(2)
        + '" rx="0.5" fill="var(--err)"/>';
    }
    body.innerHTML =
      '<svg class="spark" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" role="img" aria-label="Disponibilité récente">'
      + rects + '</svg>'
      + '<div class="chart-axis"><span>' + (timeAgo(series[0].t) || "début") + '</span><span>maintenant</span></div>';
    var cur = series[n - 1];
    metric.innerHTML = Math.round(cur.ok / cur.total * 100) + '% <small>maintenant</small>';
  }

  function openDetail(name){
    var check = null;
    for(var i = 0; i < lastChecks.length; i++){
      if(lastChecks[i].checkName === name){ check = lastChecks[i]; break; }
    }
    var hist = history[name] || [];
    var isOk = check ? check.status === "ok" : (hist.length ? !!hist[hist.length - 1].s : true);

    var pill = document.getElementById("sheetPill");
    pill.className = "pill " + (isOk ? "ok" : "err");
    pill.textContent = isOk ? "OPÉRATIONNEL" : "EN PANNE";
    document.getElementById("sheetTitle").textContent = name;
    var subBits = [];
    if(check && check.detail) subBits.push(check.detail);
    if(check && check.checkedAt) subBits.push("vérifié " + (timeAgo(check.checkedAt) || "à l'instant"));
    document.getElementById("sheetSub").textContent = subBits.join("  ·  ");

    var okc = hist.reduce(function(a, p){ return a + (p.s ? 1 : 0); }, 0);
    var pct = hist.length ? Math.round(okc / hist.length * 100) : (isOk ? 100 : 0);
    var lastChange = null;
    for(var j = hist.length - 1; j > 0; j--){
      if(hist[j].s !== hist[j - 1].s){ lastChange = hist[j]; break; }
    }
    var changeTxt = lastChange ? (timeAgo(lastChange.t) || "à l'instant") : "aucun";

    var html = '<div class="stat-row">'
      + '<div class="stat"><div class="stat-val">' + pct + '%</div><div class="stat-lbl">disponibilité</div></div>'
      + '<div class="stat"><div class="stat-val">' + hist.length + '</div><div class="stat-lbl">relevés</div></div>'
      + '<div class="stat"><div class="stat-val" style="font-size:14px">' + changeTxt + '</div><div class="stat-lbl">dernier changement</div></div>'
      + '</div>';

    if(hist.length){
      html += '<div class="sheet-section-title">Historique des relevés</div><div class="timeline">';
      hist.forEach(function(p){
        html += '<span class="tl ' + (p.s ? "ok" : "err") + '" title="' + fullTime(p.t) + '"></span>';
      });
      html += '</div>';
    }

    var changes = [];
    for(var k = 1; k < hist.length; k++){
      if(hist[k].s !== hist[k - 1].s) changes.push({ t: hist[k].t, to: hist[k].s });
    }
    changes.reverse();
    html += '<div class="sheet-section-title">Changements récents</div>';
    if(changes.length){
      changes.slice(0, 8).forEach(function(ch){
        html += '<div class="change"><span class="change-to ' + (ch.to ? "ok" : "err") + '">'
          + (ch.to ? "Rétabli" : "Tombé en panne") + '</span><span class="change-time">'
          + (timeAgo(ch.t) || "à l'instant") + '</span></div>';
      });
    } else {
      html += '<div class="sheet-muted">Aucun changement enregistré'
        + (hist.length ? ' — stable sur les ' + hist.length + ' derniers relevés.' : '.') + '</div>';
    }

    document.getElementById("sheetContent").innerHTML = html;
    var modal = document.getElementById("detailModal");
    modal.classList.add("show");
    modal.setAttribute("aria-hidden", "false");
  }

  function closeDetail(){
    var modal = document.getElementById("detailModal");
    modal.classList.remove("show");
    modal.setAttribute("aria-hidden", "true");
  }
  function historyStrip(name){
    var arr = history[name] || [];
    if(arr.length < 2) return null;   // rien d'utile à montrer avec un seul point
    var strip = document.createElement("div");
    strip.className = "history";
    var okCount = 0;
    arr.forEach(function(p){
      if(p.s) okCount++;
      var d = document.createElement("span");
      d.className = "hdot " + (p.s ? "ok" : "err");
      d.title = fullTime(p.t) + " · " + (p.s ? "ok" : "erreur");
      strip.appendChild(d);
    });
    var pct = Math.round((okCount / arr.length) * 100);
    var lbl = document.createElement("span");
    lbl.className = "history-lbl";
    lbl.textContent = pct + "% · " + arr.length + " relevés";
    strip.appendChild(lbl);
    return strip;
  }

  function showToast(msg){
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function(){ t.classList.remove("show"); }, 1800);
  }
  function copyText(text){
    if(!text) return;
    var done = function(){ showToast("Copié : " + text); };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(done).catch(function(){ fallbackCopy(text, done); });
    } else { fallbackCopy(text, done); }
  }
  function fallbackCopy(text, done){
    try {
      var ta = document.createElement("textarea");
      ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
      done();
    } catch(e){ showToast("Copie impossible"); }
  }

  function timeAgo(iso){
    if(!iso) return "";
    var d = new Date(iso);
    if(isNaN(d.getTime())) return "";
    var diff = Math.round((Date.now() - d.getTime())/1000);
    if(diff < 5) return "à l'instant";
    if(diff < 60) return diff + " s";
    var min = Math.round(diff/60);
    if(min < 60) return "il y a " + min + " min";
    var h = Math.round(min/60);
    if(h < 24) return "il y a " + h + " h";
    var days = Math.round(h/24);
    return "il y a " + days + " j";
  }

  function el(tag, cls, html){
    var e = document.createElement("div");
    if(cls) e.className = cls;
    if(html !== undefined) e.innerHTML = html;
    return e;
  }

  function fullTime(iso){
    if(!iso) return "";
    var d = new Date(iso);
    if(isNaN(d.getTime())) return "";
    try { return d.toLocaleString("fr-CH", { dateStyle:"medium", timeStyle:"short" }); }
    catch(e){ return d.toLocaleString(); }
  }

  function timeEl(iso){
    var e = document.createElement("div");
    e.className = "row-time";
    if(iso){ e.setAttribute("data-iso", iso); e.title = fullTime(iso); }
    e.textContent = timeAgo(iso);
    return e;
  }

  function refreshTimes(){
    var nodes = document.querySelectorAll("[data-iso]");
    for(var i = 0; i < nodes.length; i++){
      nodes[i].textContent = timeAgo(nodes[i].getAttribute("data-iso"));
    }
  }

  function newestCheckedAt(checks){
    var newest = 0;
    (checks || []).forEach(function(c){
      var t = new Date(c.checkedAt).getTime();
      if(!isNaN(t) && t > newest) newest = t;
    });
    return newest;
  }

  function renderChecks(checks){
    var list = document.getElementById("checksList");
    var count = document.getElementById("checksCount");
    lastChecks = checks || [];
    list.innerHTML = "";
    if(!checks || checks.length === 0){
      list.appendChild(el("div","empty","Aucun relevé pour l'instant."));
      count.textContent = "0";
      return { ok: true, hasData:false, okCount:0, total:0 };
    }
    var okCount = 0;
    checks.sort(function(a,b){ return a.checkName.localeCompare(b.checkName); });
    checks.forEach(function(c){
      var isOk = c.status === "ok";
      if(isOk) okCount++;
      var row = el("div","row tappable" + (isOk ? "" : " err"));
      row.title = "Voir le détail";
      (function(name){ row.addEventListener("click", function(){ openDetail(name); }); })(c.checkName);
      var main = el("div","row-main");
      main.appendChild(el("div","row-title",
        '<span class="tag">' + (isOk ? "OK" : "ERREUR") + '</span>' + escapeHtml(c.checkName)));
      main.appendChild(el("div","row-detail", escapeHtml(c.detail || "")));
      var strip = historyStrip(c.checkName);
      if(strip) main.appendChild(strip);
      row.appendChild(main);
      row.appendChild(timeEl(c.checkedAt));
      list.appendChild(row);
    });
    count.textContent = okCount + "/" + checks.length;
    return { ok: okCount === checks.length, hasData:true, okCount:okCount, total:checks.length };
  }

  function renderPlays(plays){
    var list = document.getElementById("playsList");
    var count = document.getElementById("playsCount");
    list.innerHTML = "";
    if(!plays || plays.length === 0){
      list.appendChild(el("div","empty","Aucun mouvement pour l'instant — la garnison est tranquille."));
      count.textContent = "0";
      return;
    }
    var achats = plays.filter(function(p){ return p.eventType === "achat"; }).length;
    var parties = plays.length - achats;
    var bits = [];
    if(achats) bits.push(achats + " achat" + (achats > 1 ? "s" : ""));
    if(parties) bits.push(parties + " partie" + (parties > 1 ? "s" : ""));
    count.textContent = bits.length ? bits.join(" · ") : String(plays.length);
    plays.forEach(function(p){
      var isAchat = p.eventType === "achat";
      var row = el("div","row copyable");
      var main = el("div","row-main");
      var label = isAchat ? "ACHAT" : "PARTIE";
      var title = isAchat
        ? (p.email || "Acheteur inconnu")
        : "Code utilisé";
      main.appendChild(el("div","row-title",
        '<span class="tag">' + label + '</span>' + escapeHtml(title)));
      var detailBits = [];
      if(p.code) detailBits.push(p.code);
      if(p.langue) detailBits.push(p.langue.toUpperCase());
      main.appendChild(el("div","row-detail", escapeHtml(detailBits.join(" · "))));
      row.appendChild(main);
      row.appendChild(timeEl(p.happenedAt));
      var copyVal = p.code || p.email || "";
      if(copyVal){
        row.title = "Toucher pour copier";
        row.addEventListener("click", function(){ copyText(copyVal); });
      }
      list.appendChild(row);
    });
  }

  function renderErrors(errors){
    var list = document.getElementById("errorsList");
    var count = document.getElementById("errorsCount");
    list.innerHTML = "";
    if(!errors || errors.length === 0){
      list.appendChild(el("div","empty","Aucun incident enregistré."));
      count.textContent = "0";
      return;
    }
    count.textContent = errors.length;
    errors.forEach(function(e){
      var row = el("div","row err copyable");
      var main = el("div","row-main");
      main.appendChild(el("div","row-title",
        '<span class="tag">' + escapeHtml(e.workflowName || "Workflow") + '</span>' + escapeHtml(e.nodeName || "")));
      main.appendChild(el("div","row-detail", escapeHtml(e.message || "")));
      row.appendChild(main);
      row.appendChild(timeEl(e.happenedAt));
      if(e.message){
        row.title = "Toucher pour copier le message";
        row.addEventListener("click", function(){ copyText(e.message); });
      }
      list.appendChild(row);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  function setHero(state, info){
    info = info || {};
    var status = document.getElementById("heroStatus");
    var sub = document.getElementById("heroSub");
    var age = info.newestIso ? (" · relevé " + (timeAgo(info.newestIso) || "à l'instant")) : "";
    if(state === "ok"){
      status.className = "hero-status ok";
      status.innerHTML = '<span class="dot ok"></span>Opérationnel';
      sub.textContent = info.total
        ? (info.okCount + "/" + info.total + " systèmes" + age)
        : "Tous les systèmes répondent normalement";
    } else if(state === "incident"){
      status.className = "hero-status err";
      status.innerHTML = '<span class="dot err"></span>Incident';
      sub.textContent = info.okCount + "/" + info.total + " systèmes opérationnels" + age;
    } else if(state === "stale"){
      status.className = "hero-status warn";
      status.innerHTML = '<span class="dot warn"></span>Surveillance en retard';
      sub.textContent = "Dernier relevé " + (timeAgo(info.newestIso) || "inconnu")
        + " — le contrôle horaire est peut-être arrêté";
    } else {
      status.className = "hero-status err";
      status.innerHTML = '<span class="dot err"></span>Poste injoignable';
      sub.textContent = "Impossible de contacter le Watchtower";
    }
  }

  function setRefreshing(on){
    isRefreshing = on;
    var btn = document.getElementById("refreshBtn");
    var prog = document.getElementById("progress");
    if(on){
      btn.disabled = true;
      document.getElementById("refreshLabel").innerHTML =
        '<span class="refresh-spin"></span>Actualisation…';
      prog.classList.remove("done");
      void prog.offsetWidth;           // reflow pour relancer l'animation
      prog.classList.add("active");
    } else {
      btn.disabled = false;
      prog.classList.remove("active");
      prog.classList.add("done");
    }
  }

  function setBanner(msg){
    var b = document.getElementById("banner");
    if(msg){ b.textContent = msg; b.classList.add("show"); }
    else { b.textContent = ""; b.classList.remove("show"); }
  }

  function setLastRefresh(iso){
    document.getElementById("refreshLabel").innerHTML =
      'Actualisé <span id="lastRefresh" data-iso="' + (iso || "") + '">'
      + (timeAgo(iso) || "à l'instant") + '</span> · appuyer pour rafraîchir';
  }

  function applyData(data){
    var checksResult = renderChecks(data.checks);
    renderPlays(data.plays);
    renderErrors(data.errors);
    renderChart();
    var newest = newestCheckedAt(data.checks);
    checksResult.newestIso = newest ? new Date(newest).toISOString() : null;
    var stale = newest > 0 && (Date.now() - newest) > STALE_MS;
    if(stale){
      setHero("stale", { newestIso: checksResult.newestIso });
    } else if(checksResult.ok){
      setHero("ok", checksResult);
    } else {
      setHero("incident", checksResult);
    }
    setLastRefresh(data.generatedAt);
  }

  function showCachedFallback(){
    var raw = lsGet(CACHE_KEY);
    if(raw){
      try {
        var cached = JSON.parse(raw);
        applyData(cached.data);
        setBanner("Hors ligne — données du " + (fullTime(cached.savedAt) || "dernier relevé"));
        return;
      } catch(e){ /* cache corrompu, on tombe sur l'état injoignable */ }
    }
    setHero("unreachable");
    document.getElementById("refreshLabel").textContent = "Hors ligne · appuyer pour réessayer";
  }

  function refresh(){
    if(isRefreshing) return;
    setRefreshing(true);
    fetch(STATUS_URL, { method: "GET", cache: "no-store" })
      .then(function(r){
        if(!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(function(data){
        setBanner("");
        recordHistory(data.checks);
        applyData(data);
        lsSet(CACHE_KEY, JSON.stringify({ savedAt: new Date().toISOString(), data: data }));
      })
      .catch(function(){
        showCachedFallback();
      })
      .then(function(){
        setRefreshing(false);
      });
  }

  function startPolling(){
    if(!pollTimer) pollTimer = setInterval(refresh, REFRESH_MS);
  }
  function stopPolling(){
    if(pollTimer){ clearInterval(pollTimer); pollTimer = null; }
  }

  // Heures relatives qui s'actualisent sans refetch
  setInterval(refreshTimes, TICK_MS);

  // Économie de batterie : pause quand l'app est cachée, refresh au retour
  document.addEventListener("visibilitychange", function(){
    if(document.hidden){ stopPolling(); }
    else { refresh(); startPolling(); }
  });
  window.addEventListener("focus", function(){ if(!document.hidden) refresh(); });

  // Rafraîchissement manuel
  document.getElementById("refreshBtn").addEventListener("click", refresh);

  // Fiche détail : fermeture
  document.getElementById("sheetClose").addEventListener("click", closeDetail);
  document.getElementById("detailModal").addEventListener("click", function(e){
    if(e.target === this) closeDetail();
  });
  document.addEventListener("keydown", function(e){
    if(e.key === "Escape") closeDetail();
  });

  // Sections repliables (état mémorisé par appareil)
  function loadCollapsed(){
    try { return JSON.parse(lsGet(COLLAPSE_KEY) || "{}") || {}; } catch(e){ return {}; }
  }
  (function initCollapsible(){
    var state = loadCollapsed();
    var bands = document.querySelectorAll(".band[data-key]");
    for(var i = 0; i < bands.length; i++){
      (function(band){
        var key = band.getAttribute("data-key");
        var head = band.querySelector(".band-head");
        if(state[key]){ band.classList.add("collapsed"); head.setAttribute("aria-expanded","false"); }
        function toggle(){
          var collapsed = band.classList.toggle("collapsed");
          head.setAttribute("aria-expanded", collapsed ? "false" : "true");
          var s = loadCollapsed(); s[key] = collapsed; lsSet(COLLAPSE_KEY, JSON.stringify(s));
        }
        head.addEventListener("click", toggle);
        head.addEventListener("keydown", function(e){
          if(e.key === "Enter" || e.key === " "){ e.preventDefault(); toggle(); }
        });
      })(bands[i]);
    }
  })();

  // Détection connexion
  window.addEventListener("offline", function(){ setBanner("Hors ligne — reconnexion en attente"); });
  window.addEventListener("online", function(){ setBanner(""); refresh(); });

  refresh();
  startPolling();

  // --- OneSignal push ---
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  var subscribeBtn = document.getElementById("subscribeBtn");

  function updateSubscribeButton(OneSignal){
    var subscribed = OneSignal.User.PushSubscription.optedIn;
    if(subscribed){
      subscribeBtn.textContent = "Notifications activées";
      subscribeBtn.disabled = true;
    } else {
      subscribeBtn.textContent = "Activer les notifications";
      subscribeBtn.disabled = false;
    }
  }

  OneSignalDeferred.push(async function(OneSignal){
    await OneSignal.init({ appId: "5798010b-42f1-4929-bbd9-f8295f0a13bf" });
    updateSubscribeButton(OneSignal);
    OneSignal.User.PushSubscription.addEventListener("change", function(){
      updateSubscribeButton(OneSignal);
    });
    subscribeBtn.addEventListener("click", function(){
      OneSignal.Notifications.requestPermission();
    });
  });

  if("serviceWorker" in navigator){
    navigator.serviceWorker.register("/OneSignalSDKWorker.js");
  }
})();
</script>

</body>
</html>
